schema: spec-driven

context: |
  Vault Admin — a BepInEx mod for Fallout Shelter (Steam PC, v2.6.0, Unity 6000.0.58, Mono).
  A debug panel built INTO the game's own interface, able to create dwellers, weapons and pets
  with full control over every attribute the game holds.

  Stack and build
    C# targeting the Unity Mono profile. No .NET SDK: compiled with
    C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe using /nostdlib+ /noconfig against the
    game's own assemblies in FalloutShelter_Data\Managed. BepInEx 5.4.23.5, which ships HarmonyX
    alongside it — this mod uses none of it. There are no patches at all: everything goes through
    the game's own methods, reached by reflection.
    Build with .\build.ps1; it reads PluginVersion out of the source, so the version number exists
    in exactly one place. It prints the compiler's warnings before its success line and proves the
    install by hash. tools/verify-install.py answers, separately, whether the plugin the game will
    load is the one that was just built.

  The single most important constraint
    The agent cannot run the game or see the screen. Anything needing a running game costs a round
    trip with the user. Verify everything possible against the assemblies, the save file and the
    compiled DLL first; batch what genuinely needs a launch.

  The UI must be part of the game
    Not an IMGUI overlay drawn on top. The panel is built from the game's own NGUI widgets —
    UIAtlas, UISprite, UILabel, UIButton, UIPanel — parented into the game's UI hierarchy so it
    looks and behaves like the rest of the interface. An IMGUI scaffold remains, reached only when
    the NGUI window cannot be built at all, so a UI failure is a UI failure and not a dead mod.

  What this game does that is worth knowing before writing against it
    A dweller carries no Animator. It is driven by the legacy Animation component with the game's
    own controller on top, and that controller replaces any clip anybody else sets, one frame later.
    ApplyCustomization only ever puts a piece on; nothing takes one off.
    Equipping a dweller returns whatever it was wearing to the vault's storage — which mints real
    items when what it was wearing was fabricated rather than taken from the vault.
    A pooled dweller arrives with no pieces and no outfit, and carries a visibility detector that
    stops the game when something looks at it.

  Where the game keeps things, each found the hard way
    Which vault is loaded: PersistenceManager.CurrentSaveSlot, a string like "Vault1". Not on
    SaveManager, and not on anything named after a vault. The Vault object itself carries no name
    and no number at all -- it lists MaxDwellers, RoomCount and CellsPerRow and nothing that
    identifies it. Four rounds of guessing at class names went past this; a sweep for the member
    name found it in one.
    The room a dweller works in: Dweller.WorkingRoom. Not CurrentRoom, not assignedRoom -- and
    both of those read null, which is also what a dweller in no room reads as, so neither guess
    announced itself as wrong.
    How many a living quarters sleeps: m_addedPopulation, on the room. It is not how many can work
    in it, and it is not in the room's settings: it is a value on the room, already accounting for
    how wide it has been merged and how far it has been upgraded. Nothing anywhere in the game
    holds the vault's total as one number -- it has to be summed.
    EquipOutfit's second argument decides whether the game does its own bookkeeping. False is for
    a figure that is only a picture; on a real dweller it means the coat taken off ceases to exist
    and the coat put on never reaches the save.
    Whether a dweller is inside: Dweller.IsInVault. The queue at the door is dwellers the game has
    built and not let in, and assigning one to a room walks it inside past the population limit.
    ClampedMaxDwellers is what the game reads through; writing MaxDwellers above it changes
    nothing a player can see.

  How to find the next one
    Guessing a member name has been wrong every time it was tried, and each wrong guess reads as
    null, which is indistinguishable from the answer being no. Dump what the object actually holds
    -- fields, properties, values -- and read it. Every hard problem in this project was solved
    that way, and every long detour was an attempt to avoid it.
    When several things answer, log all of them and choose. Taking the first match made the font a
    lottery once and gave every vault the same key once.

  Danger
    This mod writes to the player's save. Writing an id or enum value the base game does not know
    is how a save stops loading. Every value the panel offers must come from the game's own tables;
    offer a picker over what exists, never a free-text id.

  What is already known about this game
    Saves: base64 -> AES-256-CBC -> JSON. The helper that read them (scratchpad/fslib.py) has not
    survived; a save cannot currently be read outside the game.
    Saves live in %LocalAppData%\FalloutShelter\.
    Lunchboxes are not a resource: they are LunchBoxesByType plus LunchBoxesCount.
    Legacy UnityEngine.Input throws; the game uses the new Input System.
    ParameterDataMgr.Instance holds room data; GameParameters.Instance.Resources maps resources to
    icons, by bit flag, and a miss silently returns an unrelated sprite.
    ../docs/room-visuals-findings.md and ../CapsFoundry/README.md hold the rest.

  Tools already in the repo
    ../tools/ildasm.ps1 disassembles a method. ../tools/findcallers.ps1 finds callers.
    ../tools/SaveBackup is a dev-only plugin that copies saves at game start; it stays installed
    for this entire project and is never shipped.

rules:
  proposal:
    - State what cannot be verified without a running game, and say so explicitly.
    - Name the game types and methods the change depends on, and how their existence was confirmed.
    - Include a Non-goals section.
  tasks:
    - Every task must be checkable by the agent alone, or explicitly marked as needing a launch.
    - Tasks that write to a save must be preceded by a task that proves the write round-trips.
  spec:
    - Requirements describe observable behaviour in the game, not implementation.
    - Every requirement that writes data states what happens when the mod is later removed.

operations:
  apply:
    guidance:
      - Never trust a build script's success line. Read the installed DLL back and check its size,
        its version, and a string only the new build contains.
      - The game must be closed before installing. The build script refuses otherwise.
      - Confirm zero compiler errors and zero warnings before moving on.
      - Nothing goes in Update that is not bounded. No scans of all loaded objects per frame.
  archive:
    guidance:
      - Record anything newly learned about the game in the repo, not only in the change.
      - A save written by this mod must still load with the mod removed before a change is archived.
